name: Checks

on:
  pull_request:
  push:
    branches:
      - master
      - 'req/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: regression-${{ matrix.os }}
      - name: Install frontend dependencies
        run: npm ci
      - name: UI regression
        run: npm run test:ui
      - name: Release version regression
        run: node --test scripts/set-release-version.test.mjs
      - name: Core and native platform regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Core lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets --locked -- -D warnings
      - name: Typecheck and frontend build
        run: npm run build
