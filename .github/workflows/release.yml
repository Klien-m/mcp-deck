name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重建的已有标签（例如 v0.3）；留空时使用当前标签'
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v7

      - name: Keep version script from workflow revision
        shell: bash
        run: cp scripts/set-release-version.mjs "$RUNNER_TEMP/set-release-version.mjs"

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set application version from tag
        shell: bash
        run: node "$RUNNER_TEMP/set-release-version.mjs" "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Install custom macOS packaging
        if: runner.os == 'macOS' && hashFiles('scripts/build-dmg.py') != ''
        run: |
          python3 -m venv .local-dev/dmg-venv
          .local-dev/dmg-venv/bin/python -m pip install -r scripts/dmg-requirements.txt

      - name: Build installers
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
        run: |
          if [[ "$RUNNER_OS" == 'macOS' && ! -f scripts/build-dmg.py ]]; then
            BUILD_BUNDLES=dmg
          fi
          npm run tauri build -- --ci --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" -- --locked

      - name: Build macOS disk image
        if: runner.os == 'macOS' && hashFiles('scripts/build-dmg.py') != ''
        run: .local-dev/dmg-venv/bin/python scripts/build-dmg.py --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Keep release notes script from workflow revision
        run: cp scripts/release-notes.mjs "$RUNNER_TEMP/release-notes.mjs"

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-assets

      - name: Generate release notes
        run: node "$RUNNER_TEMP/release-notes.mjs" "$RELEASE_TAG" > release-notes.md

      - name: Upload installers and publish
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0)
          if [ "${#assets[@]}" -ne 7 ]; then
            echo "Expected 7 installers, found ${#assets[@]}" >&2
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MCP Deck $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --title "MCP Deck $RELEASE_TAG" --notes-file release-notes.md
